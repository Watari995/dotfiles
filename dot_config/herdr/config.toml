onboarding = false

[theme]
name = "one-dark"

[keys]
prefix = "ctrl+a"
open_notification_target = ""
last_pane = "prefix+o"
navigate_workspace_down = "j"
navigate_workspace_up = "k"
navigate_pane_left = "h"
navigate_pane_right = "l"

[ui]
tab_bar_position = "bottom"
hide_tab_bar_when_single_tab = true
sidebar_collapsed_mode = "hidden"
pane_borders = false
host_cursor = "native"

[ui.sound]
enabled = false
